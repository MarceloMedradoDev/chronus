<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="registration">Matrícula:</label>
      <input
        id="registration"
        type="text"
        formControlName="registration"
        placeholder="Digite sua matrícula"
      />
    </div>

    <div class="form-group">
      <label for="password">Senha:</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Digite sua senha"
      />
      <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Senha obrigatória
      </div>
    </div>

    <button type="submit" id="login" [disabled]="loginForm.invalid">Entrar</button>

    <div class="login-error" *ngIf="loginError">
      {{ loginError }}
    </div>

    <!-- 🔽 Botão de cadastro -->
    <div class="register-link">
      <p>Ainda não tem conta?</p>
      <button type="button" [routerLink]="['/signUp']" class="register-btn">
        Criar Conta
      </button>
    </div>

  </form>
</div>
